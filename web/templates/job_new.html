{% extends "base.html" %}
{% block content %}
<div class="page-head">
  <div>
    <div class="sub"><a href="/jobs">&larr; Jobs</a></div>
    <h1 style="margin-top: 2px">New job</h1>
    <div class="sub">Intake only — drafts are never generated without you asking.</div>
  </div>
</div>

<form method="post" action="/job/new" class="stack">
  <label>Client name
    <span class="sub">Who is this for?</span>
    <input name="client_name" required placeholder="Jane Doe">
  </label>
  <label>Contact (optional)
    <span>email / phone for follow-up</span>
    <input name="contact" placeholder="jane@example.com">
  </label>
  <label>Target role
    <span>the position the package aims at</span>
    <input name="target_role" required placeholder="Senior Data Engineer">
  </label>
  <label>Current resume / experience
    <span>paste their latest resume or raw experience — the source of truth</span>
    <textarea name="resume_text" required rows="10" placeholder="Paste their current resume or experience here..."></textarea>
  </label>
  <label>Answers to intake questions (optional)
    <span>one per line as <code>Question: Answer</code></span>
    <textarea name="answers" rows="5" placeholder="Years of experience: 6&#10;Desired location: Remote&#10;Salary expectation: $130k"></textarea>
  </label>
  <div style="display: flex; gap: 10px; align-items: center">
    <button class="btn primary" type="submit" style="padding: 9px 18px">Save job</button>
    <span class="muted">Draft packages are generated from the job page, not here.</span>
  </div>
</form>
{% endblock %}
